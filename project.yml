name: LocationSimulatorPersonal
options:
  bundleIdPrefix: com.saint
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  # Icon Composer packages must be treated as a single file, not exploded.
  fileTypes:
    icon:
      file: true
settings:
  base:
    # Personal Team used for this private on-device build.
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
targets:
  LocationSimulatorPersonal:
    type: application
    platform: iOS
    sources:
      - path: Locus
        excludes:
          - "**/Info.plist"
          - "Resources/Assets.xcassets"
      - path: Shared
      - path: Vendor/idevice/module.modulemap
        buildPhase: none
      - path: Vendor/idevice/idevice.h
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.saint.locationsimulator.personal
        PRODUCT_NAME: LocationSimulatorPersonal
        MARKETING_VERSION: "1.5.2"
        CURRENT_PROJECT_VERSION: "14"
        INFOPLIST_FILE: Locus/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Locus/Resources/Locus.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: false
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/Vendor/idevice"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lidevice_ffi"
          - "-lc++"
          - "-lz"
        SWIFT_INCLUDE_PATHS: "$(PROJECT_DIR)/Vendor/idevice"
        HEADER_SEARCH_PATHS: "$(PROJECT_DIR)/Vendor/idevice"
        ENABLE_BITCODE: NO
        SUPPORTS_MACCATALYST: NO
        SWIFT_OBJC_BRIDGING_HEADER: ""
    dependencies:
      - target: TripActivityExtension
        embed: true
  TripActivityExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: TripActivityExtension
        excludes:
          - "Info.plist"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.saint.locationsimulator.personal.tripactivity
        PRODUCT_NAME: TripActivityExtension
        MARKETING_VERSION: "1.5.2"
        CURRENT_PROJECT_VERSION: "14"
        INFOPLIST_FILE: TripActivityExtension/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: false
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
